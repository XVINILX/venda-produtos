name: 🚫 Bloquear Push se Testes Falharem

on:
  push:
    branches: [main, hml, dev]
  pull_request:
    branches: [main, hml, dev]

jobs:
  backend-tests:
    name: 🐍 Backend Tests (Obrigatório)
    runs-on: ubuntu-latest
    # Este job é obrigatório - se falhar, bloqueia o merge/push

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_wisesales
          POSTGRES_USER: wisesales
          POSTGRES_PASSWORD: wisesales123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Instalar dependências
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: 🗄️ Rodar migrações
        run: |
          cd backend
          export DB_HOST=localhost
          export DB_PORT=5432
          export DB_NAME=test_wisesales
          export DB_USER=wisesales
          export DB_PASSWORD=wisesales123
          alembic upgrade head

      - name: 🧪 Executar testes (mínimo 50% cobertura)
        run: |
          cd backend
          export DB_HOST=localhost
          export DB_PORT=5432
          export DB_NAME=test_wisesales
          export DB_USER=wisesales
          export DB_PASSWORD=wisesales123
          export ENVIRONMENT=test

          # Se os testes falharem ou cobertura <50%, este job falha
          pytest --cov=src \
                 --cov-fail-under=50 \
                 --cov-report=term-missing \
                 --junitxml=test-results.xml

      - name: 📊 Upload resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml

  security-scan:
    name: 🔒 Segurança (Recomendado)
    runs-on: ubuntu-latest
    # Este job é recomendado, mas não bloqueia (pode ser ajustado)

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🔍 Scan de vulnerabilidades no backend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "./backend"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: 🔍 Scan de vulnerabilidades no frontend
        run: |
          cd frontend
          npm audit --production

  required-checks:
    name: ✅ Verificações Obrigatórias
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, integration-tests]
    if: always()

    steps:
      - name: 🔍 Verificar status dos jobs obrigatórios
        run: |
          if [[ "${{ needs.backend-tests.result }}" == "failure" || \
                "${{ needs.frontend-tests.result }}" == "failure" || \
                "${{ needs.integration-tests.result }}" == "failure" ]]; then
            echo "❌ Testes obrigatórios falharam!"
            exit 1
          else
            echo "✅ Todos os testes obrigatórios passaram!"
          fi

  notify:
    name: 📢 Notificar Resultado
    runs-on: ubuntu-latest
    needs: [required-checks, security-scan]
    if: always()

    steps:
      - name: 💬 Criar comentário no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const backendStatus = '${{ needs.backend-tests.result }}';
            const frontendStatus = '${{ needs.frontend-tests.result }}';
            const integrationStatus = '${{ needs.integration-tests.result }}';
            const securityStatus = '${{ needs.security-scan.result }}';

            let message = '## 📊 Resultado dos Testes\n\n';

            message += `- 🐍 Backend: **${backendStatus === 'success' ? '✅' : '❌'}**\n`;
            message += `- ⚛️ Frontend: **${frontendStatus === 'success' ? '✅' : '❌'}**\n`;
            message += `- 🔄 Integração: **${integrationStatus === 'success' ? '✅' : '❌'}**\n`;
            message += `- 🔒 Segurança: **${securityStatus === 'success' ? '✅' : '⚠️'}**\n\n`;

            if (backendStatus === 'success' && frontendStatus === 'success' && integrationStatus === 'success') {
              message += '✅ **Todos os testes passaram!** O código pode ser mergeado.';
            } else {
              message += '❌ **Alguns testes falharam!** Corrija os problemas antes de fazer merge.';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

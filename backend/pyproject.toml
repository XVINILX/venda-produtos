# backend/pyproject.toml
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",   # Pyflakes
    "E",   # Pycodestyle
    "W",   # Pycodestyle warnings
    "I",   # Isort
    "N",   # Pep8-naming
    "UP",  # Pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # Ignorar linha longa em testes

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"